<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;}
  .stage{width:1280px;height:720px;position:relative;overflow:hidden;background:#050705;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="stage">
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ffb0"/>
      <stop offset="55%" stop-color="#12e0c4"/>
      <stop offset="100%" stop-color="#3ba7ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip">
      <path d="M -160 0 C -95 -95 -35 -128 0 -128 C 35 -128 95 -95 160 0 C 95 95 35 128 0 128 C -35 128 -95 95 -160 0 Z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="720" fill="#050705"/>

  <!-- icon mark: an open eye, sigil-filled ("catches lies") -->
  <g transform="translate(300,360)">
    <!-- eye outline -->
    <path d="M -160 0 C -95 -95 -35 -128 0 -128 C 35 -128 95 -95 160 0 C 95 95 35 128 0 128 C -35 128 -95 95 -160 0 Z"
          fill="#050505" stroke="url(#sig)" stroke-width="6" filter="url(#glow)"/>

    <g clip-path="url(#eyeClip)" filter="url(#glow)">
      <g stroke="url(#sig)" fill="none" stroke-width="1.4" opacity="0.9">
        <circle cx="0" cy="0" r="95"/>
        <circle cx="0" cy="0" r="66"/>
        <circle cx="0" cy="0" r="38"/>
      </g>
      <g stroke="url(#sig)" fill="none" stroke-width="1" opacity="0.6">
        <line x1="-160" y1="0" x2="160" y2="0"/>
        <line x1="0" y1="-128" x2="0" y2="128"/>
        <line x1="-113" y1="-80" x2="113" y2="80"/>
        <line x1="113" y1="-80" x2="-113" y2="80"/>
        <line x1="-140" y1="-40" x2="140" y2="40"/>
        <line x1="140" y1="-40" x2="-140" y2="40"/>
      </g>
      <g fill="none" stroke="url(#sig)" stroke-width="1.3" opacity="0.85">
        <polygon points="0,-38 33,0 0,38 -33,0"/>
      </g>
    </g>

    <!-- iris core, solid glowing pupil -->
    <circle cx="0" cy="0" r="19" fill="url(#sig)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="7" fill="#050505"/>
  </g>

  <!-- wordmark -->
  <text x="520" y="400" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="150" fill="#ffffff" letter-spacing="-3">NoCap</text>
  <text x="524" y="450" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="27" fill="#7fdfc2" letter-spacing="2">NO CHATBOT LIES</text>

</svg>
</div>
</body>
</html>
