<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;}
  .stage{width:1280px;height:720px;position:relative;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="stage">
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2f8f"/>
      <stop offset="55%" stop-color="#ef1258"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#0a0a0a"/>

  <!-- icon mark: a rounded hexagon (shield-adjacent, sigil-adjacent) with one clean checkmark rune inside -->
  <g transform="translate(300,360)">
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65"
             fill="none" stroke="url(#mark)" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- inner sigil accent: a single diagonal rune line crossing the checkmark, restrained -->
    <line x1="-70" y1="-70" x2="70" y2="70" stroke="url(#mark)" stroke-width="3" opacity="0.35"/>
    <!-- checkmark -->
    <path d="M -55 5 L -12 48 L 62 -55"
          fill="none" stroke="url(#mark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="470" y="400" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="150" fill="#ffffff" letter-spacing="-3">NoCap</text>
  <text x="474" y="450" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="27" fill="#b98a9c" letter-spacing="1">NO CAP, NO CHATBOT LIES</text>

</svg>
</div>
</body>
</html>
