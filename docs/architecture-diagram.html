<title>NoCap Architecture</title>
<meta name="description" content="How a document becomes trustworthy in NoCap: the autonomous Inspector, Repair, and Verifier pipeline, its Pub/Sub triggers, and its live audit trail.">

<style>
  :root {
    --bg: #0a0f0c;
    --surface: #10160f;
    --surface-2: #171e17;
    --border: #263129;
    --border-strong: #3a483f;
    --ink: #eef3ee;
    --ink-muted: #a7b3a9;
    --ink-faint: #6f7b71;
    --accent: #6fe08a;
    --good: #6fe08a;
    --warning: #f0b45b;
    --critical: #f2666a;
    --font-sans: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8f6;
      --surface: #ffffff;
      --surface-2: #eef2ee;
      --border: #dbe3dc;
      --border-strong: #c1cbc3;
      --ink: #16201a;
      --ink-muted: #57614f;
      --ink-faint: #8b988e;
      --accent: #1f9d4a;
      --good: #1f9d4a;
      --warning: #a8660a;
      --critical: #c23b3f;
    }
  }

  :root[data-theme="light"] {
    --bg: #f6f8f6;
    --surface: #ffffff;
    --surface-2: #eef2ee;
    --border: #dbe3dc;
    --border-strong: #c1cbc3;
    --ink: #16201a;
    --ink-muted: #57614f;
    --ink-faint: #8b988e;
    --accent: #1f9d4a;
    --good: #1f9d4a;
    --warning: #a8660a;
    --critical: #c23b3f;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    padding: 48px 24px 64px;
  }

  .page {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .eyebrow::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  h1 {
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 700;
    line-height: 1.15;
    text-wrap: balance;
    margin: 0;
  }

  .dek {
    color: var(--ink-muted);
    font-size: 15.5px;
    line-height: 1.65;
    max-width: 62ch;
    margin: 0;
  }

  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    overflow-x: auto;
  }

  figure svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 640px;
  }

  figcaption {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--ink-muted);
    font-size: 14px;
    line-height: 1.65;
    max-width: 68ch;
  }

  figcaption strong {
    color: var(--ink);
    font-weight: 600;
  }

  .stack {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .pill {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 7px 14px;
    background: var(--surface-2);
  }

  .stack-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    align-self: center;
    margin-right: 4px;
  }
</style>

<div class="page">
  <div>
    <div class="eyebrow">NoCap</div>
    <h1>System Architecture</h1>
    <p class="dek">
      How a document goes from "just uploaded" to "safe for a chatbot to cite" &mdash;
      or gets blocked &mdash; with no human between stages.
    </p>
  </div>

  <figure>

      <defs>
        <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

        </marker>
        <marker id="arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

        </marker>
        <marker id="arrow-critical" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

    <figcaption>
      <strong>Every solid arrow is a real Pub/Sub event or a Storage write, not a function call.</strong>

      subscriptions, so no human sits between stages &mdash; not even to kick off the first step, since
      uploading a document now fires that event automatically. Dashed arrows show every stage also
      writing to a live audit trail, which the dashboard reads in real time.
